openapi: 3.0.3
info:
  title: RentaCar API
  description: Especificación OpenAPI de la API REST del sistema RentaCar.
  version: 1.0.0
servers:
- url: http://127.0.0.1:8000/api
  description: Servidor Local de Desarrollo
tags:
- name: Autenticacion
  description: Inicio de sesión y usuario autenticado
- name: Clientes
  description: Operaciones CRUD sobre clientes
- name: Estados
  description: Operaciones CRUD sobre estados de vehículos
- name: Vehiculos
  description: Operaciones CRUD sobre el catálogo de vehículos
- name: Rentas
  description: Operaciones CRUD sobre rentas
- name: Categorias
  description: Operaciones CRUD sobre categorías
- name: Accesorios
  description: Operaciones CRUD sobre accesorios
paths:
  /login:
    post:
      summary: Iniciar sesión y generar token de acceso
      tags:
      - Autenticacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: test@example.com
              password: password123
              device_name: postman
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: 1|token-de-ejemplo
        '422':
          $ref: '#/components/responses/LoginValidationError'
  /user:
    get:
      summary: Obtener el usuario autenticado
      tags:
      - Autenticacion
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /clientes:
    get:
      summary: Listar clientes paginados
      tags:
      - Clientes
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        description: Buscar por nombre, cédula o correo según la implementación del servicio
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        description: Campo de ordenamiento
        required: false
        schema:
          type: string
          enum:
          - id
          - nombre1
          - apellido1
          - anno_nacimiento
          - created_at
          default: created_at
      - name: sortDir
        in: query
        description: Dirección del ordenamiento
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: perPage
        in: query
        description: Registros por página
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 15
      - name: page
        in: query
        description: Número de página
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Listado de clientes obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Crear un cliente
      tags:
      - Clientes
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
            example:
              cedula: '777777701'
              nombre1: Fernando
              nombre2: Andres
              apellido1: Mora
              apellido2: Corea
              anno_nacimiento: 2000
              telefono: '88887777'
              correo: fernando.lab5.701@example.com
      responses:
        '201':
          description: Cliente creado correctamente
          headers:
            Location:
              description: URL del cliente recién creado
              schema:
                type: string
              example: http://127.0.0.1:8000/api/clientes/52
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ClienteConflict'
        '422':
          $ref: '#/components/responses/ClienteValidationError'
  /clientes/{cliente}:
    parameters:
    - name: cliente
      in: path
      required: true
      description: ID del cliente
      schema:
        type: integer
    get:
      summary: Obtener un cliente por ID
      tags:
      - Clientes
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar un cliente
      tags:
      - Clientes
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
      responses:
        '200':
          description: Cliente actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClienteConflict'
        '422':
          $ref: '#/components/responses/ClienteValidationError'
    patch:
      summary: Actualizar un cliente
      tags:
      - Clientes
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
      responses:
        '200':
          description: Cliente actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClienteConflict'
        '422':
          $ref: '#/components/responses/ClienteValidationError'
    delete:
      summary: Eliminar un cliente
      tags:
      - Clientes
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Cliente eliminado correctamente; respuesta sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClienteConflict'
  /estados:
    get:
      summary: Listar estados paginados
      tags:
      - Estados
      security:
      - bearerAuth: []
      parameters:
      - name: nombre
        in: query
        description: Filtrar por coincidencia inicial del nombre
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: Campo para ordenar (id o nombre)
        required: false
        schema:
          type: string
          enum:
          - id
          - nombre
          default: id
      - name: direction
        in: query
        description: Dirección del ordenamiento
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - name: per_page
        in: query
        description: Registros por página (máximo 50)
        required: false
        schema:
          type: integer
          default: 15
      - name: page
        in: query
        description: Número de página
        required: false
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Listado obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Crear un nuevo estado
      tags:
      - Estados
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoInput'
      responses:
        '201':
          description: Estado creado exitosamente
          headers:
            Location:
              schema:
                type: string
              description: URL del recurso recién creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /estados/{estado}:
    get:
      summary: Obtener el detalle de un estado
      tags:
      - Estados
      security:
      - bearerAuth: []
      parameters:
      - name: estado
        in: path
        required: true
        description: ID del estado
        schema:
          type: integer
      responses:
        '200':
          description: Estado encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar un estado existente
      tags:
      - Estados
      security:
      - bearerAuth: []
      parameters:
      - name: estado
        in: path
        required: true
        description: ID del estado a actualizar
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoInput'
      responses:
        '200':
          description: Estado actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Eliminar un estado
      tags:
      - Estados
      security:
      - bearerAuth: []
      parameters:
      - name: estado
        in: path
        required: true
        description: ID del estado a eliminar
        schema:
          type: integer
      responses:
        '204':
          description: Estado eliminado correctamente (Sin contenido)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /vehiculos:
    get:
      summary: Listar vehículos paginados
      tags:
      - Vehiculos
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        description: Buscar por placa o modelo
        required: false
        schema:
          type: string
      - name: categoria_id
        in: query
        description: Filtrar por categoría
        required: false
        schema:
          type: integer
      - name: sort_by
        in: query
        description: Campo para ordenar
        required: false
        schema:
          type: string
          enum:
          - marca
          - anno
          - precio_diario
          - created_at
          default: created_at
      - name: order
        in: query
        description: Dirección del ordenamiento
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: limit
        in: query
        description: Límite de registros por página
        required: false
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: Listado obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiculoListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Crear un nuevo vehículo
      tags:
      - Vehiculos
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiculoInput'
      responses:
        '201':
          description: Vehículo creado exitosamente
          headers:
            Location:
              schema:
                type: string
              description: URL del vehículo recién creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiculoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /vehiculos/{vehiculo}:
    get:
      summary: Obtener el detalle de un vehículo
      tags:
      - Vehiculos
      security:
      - bearerAuth: []
      parameters:
      - name: vehiculo
        in: path
        required: true
        description: ID del vehículo
        schema:
          type: integer
      responses:
        '200':
          description: Vehículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiculoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar un vehículo
      tags:
      - Vehiculos
      security:
      - bearerAuth: []
      parameters:
      - name: vehiculo
        in: path
        required: true
        description: ID del vehículo a actualizar
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiculoInput'
      responses:
        '200':
          description: Vehículo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiculoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Eliminar un vehículo
      tags:
      - Vehiculos
      security:
      - bearerAuth: []
      parameters:
      - name: vehiculo
        in: path
        required: true
        description: ID del vehículo a eliminar
        schema:
          type: integer
      responses:
        '204':
          description: Vehículo eliminado (Sin contenido)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /rentas:
    get:
      summary: Listar rentas paginadas
      tags:
      - Rentas
      security:
      - bearerAuth: []
      parameters:
      - name: cliente_id
        in: query
        description: Filtrar las rentas por cliente
        required: false
        schema:
          type: integer
      - name: vehiculo_id
        in: query
        description: Filtrar las rentas por vehículo
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Listado de rentas obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentaListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Registrar una nueva renta
      tags:
      - Rentas
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentaInput'
            example:
              cliente_id: 5
              vehiculo_id: 7
              fecha_inicio: '2026-09-21'
              fecha_fin: '2026-09-25'
              precio_diario: 30000
      responses:
        '201':
          description: Renta registrada correctamente
          headers:
            Location:
              description: URL de la renta recién creada
              schema:
                type: string
              example: http://127.0.0.1:8000/api/rentas/17
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /rentas/{renta}:
    get:
      summary: Obtener el detalle de una renta
      tags:
      - Rentas
      security:
      - bearerAuth: []
      parameters:
      - name: renta
        in: path
        required: true
        description: ID de la renta
        schema:
          type: integer
      responses:
        '200':
          description: Renta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Actualizar una renta
      tags:
      - Rentas
      security:
      - bearerAuth: []
      parameters:
      - name: renta
        in: path
        required: true
        description: ID de la renta a actualizar
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentaUpdateInput'
            example:
              fecha_fin: '2026-09-25'
      responses:
        '200':
          description: Renta actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Eliminar una renta
      tags:
      - Rentas
      security:
      - bearerAuth: []
      parameters:
      - name: renta
        in: path
        required: true
        description: ID de la renta a eliminar
        schema:
          type: integer
      responses:
        '204':
          description: Renta eliminada correctamente (sin contenido)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /categorias:
    get:
      summary: Listar categorías
      tags:
      - Categorias
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        description: Número de página
        required: false
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Listado paginado de categorías
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Crear una categoría
      tags:
      - Categorias
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
      responses:
        '201':
          description: Categoría creada con éxito
          headers:
            Location:
              description: URL del recurso recién creado
              schema:
                type: string
                example: http://127.0.0.1:8000/api/categorias/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /categorias/{categoria}:
    get:
      summary: Obtener el detalle de una categoría
      tags:
      - Categorias
      security:
      - bearerAuth: []
      parameters:
      - name: categoria
        in: path
        required: true
        description: ID de la categoría
        schema:
          type: integer
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar una categoría
      tags:
      - Categorias
      security:
      - bearerAuth: []
      parameters:
      - name: categoria
        in: path
        required: true
        description: ID de la categoría a actualizar
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
      responses:
        '200':
          description: Categoría actualizada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Eliminar una categoría
      tags:
      - Categorias
      security:
      - bearerAuth: []
      parameters:
      - name: categoria
        in: path
        required: true
        description: ID de la categoría a eliminar
        schema:
          type: integer
      responses:
        '204':
          description: Categoría eliminada correctamente (Sin contenido)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /accesorios:
    get:
      summary: Listar accesorios
      tags:
      - Accesorios
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        description: Número de página
        required: false
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Listado de accesorios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccesorioListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Crear un accesorio
      tags:
      - Accesorios
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccesorioInput'
      responses:
        '201':
          description: Accesorio creado con éxito
          headers:
            Location:
              description: URL del accesorio creado
              schema:
                type: string
                example: http://127.0.0.1:8000/api/accesorios/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccesorioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /accesorios/{accesorio}:
    get:
      summary: Obtener el detalle de un accesorio
      tags:
      - Accesorios
      security:
      - bearerAuth: []
      parameters:
      - name: accesorio
        in: path
        required: true
        description: ID del accesorio
        schema:
          type: integer
      responses:
        '200':
          description: Accesorio encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccesorioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar un accesorio
      tags:
      - Accesorios
      security:
      - bearerAuth: []
      parameters:
      - name: accesorio
        in: path
        required: true
        description: ID del accesorio a actualizar
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccesorioInput'
      responses:
        '200':
          description: Accesorio actualizado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccesorioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Eliminar un accesorio
      tags:
      - Accesorios
      security:
      - bearerAuth: []
      parameters:
      - name: accesorio
        in: path
        required: true
        description: ID del accesorio a eliminar
        schema:
          type: integer
      responses:
        '204':
          description: Accesorio eliminado (Sin contenido)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
